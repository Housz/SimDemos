<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XPBD 刚体模拟 —— 论文复现（Detailed Rigid Body Simulation with Extended Position Based Dynamics）</title>
<style>
    :root {
        --bg: #0f1116;
        --panel: #171a21;
        --panel-2: #1e222b;
        --line: #2a2f3a;
        --fg: #e6e9ef;
        --fg-dim: #98a2b3;
        --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; height: 100%;
        background: var(--bg); color: var(--fg);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        overflow: hidden;
    }
    #app { display: flex; height: 100%; }

    /* ---------------- 左侧栏 ---------------- */
    #sidebar {
        width: 268px; flex: 0 0 268px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex; flex-direction: column;
        overflow-y: auto;
    }
    #sidebar header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
    }
    #sidebar h1 {
        font-size: 13px; margin: 0 0 4px; font-weight: 600; letter-spacing: .02em;
    }
    #sidebar h1 span { color: var(--accent); }
    #sidebar .sub { font-size: 11px; color: var(--fg-dim); line-height: 1.5; }

    #scene-list { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .scene-btn {
        display: block; width: 100%; text-align: left;
        background: transparent; border: 1px solid transparent;
        color: var(--fg); border-radius: 6px;
        padding: 8px 10px; font-size: 12.5px; cursor: pointer;
        font-family: inherit; line-height: 1.35;
        transition: background .12s, border-color .12s;
    }
    .scene-btn:hover { background: var(--panel-2); }
    .scene-btn.active {
        background: rgba(110,168,254,.14);
        border-color: rgba(110,168,254,.5);
        color: #cfe0ff;
    }
    .scene-btn .tag {
        display: block; font-size: 10.5px; color: var(--fg-dim); margin-top: 2px;
    }
    .scene-btn.active .tag { color: #8fb4f5; }

    #scene-info {
        margin: 4px 12px 14px; padding: 10px 12px;
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 6px; font-size: 11.5px; line-height: 1.7; color: var(--fg-dim);
    }
    #scene-info b { color: var(--fg); font-weight: 600; }
    #scene-info code {
        background: #0b0d12; padding: 0 3px; border-radius: 3px;
        font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #9ecbff;
    }
    #sidebar footer {
        margin-top: auto; padding: 10px 16px 14px;
        border-top: 1px solid var(--line);
        font-size: 10.5px; color: #6b7484; line-height: 1.6;
    }
    kbd {
        background: #0b0d12; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 3px; padding: 0 4px; font-family: inherit; font-size: 10px;
    }

    /* ---------------- 渲染区 ---------------- */
    #view { position: relative; flex: 1 1 auto; min-width: 0; }
    #view canvas { display: block; }

    #hud {
        position: absolute; top: 10px; left: 12px;
        pointer-events: none; font-family: ui-monospace, Consolas, monospace;
        font-size: 11.5px; line-height: 1.6;
    }
    #fps {
        display: inline-block; background: rgba(18,20,26,.72);
        border: 1px solid var(--line); border-radius: 4px;
        padding: 3px 8px; color: #7ee787;
    }
    #stats {
        background: rgba(18,20,26,.72); border: 1px solid var(--line);
        border-radius: 4px; padding: 4px 8px; margin-top: 4px;
        color: var(--fg-dim); display: inline-block;
    }
    #energy-panel {
        position: absolute; left: 12px; bottom: 12px;
        width: 260px; border: 1px solid var(--line); border-radius: 6px;
        overflow: hidden; display: none;
    }
    #energy-panel .cap {
        font-size: 10px; color: var(--fg-dim); padding: 3px 8px;
        background: rgba(18,20,26,.72); border-bottom: 1px solid var(--line);
        font-family: ui-monospace, monospace;
    }
    #energy { display: block; width: 100%; height: 92px; }
    #energy-panel .legend {
        font-size: 10px; padding: 3px 8px; background: rgba(18,20,26,.72);
        font-family: ui-monospace, monospace; display: flex; gap: 10px;
    }

    /* 右上角：场景实时读数（关节力、伸长、能量…） */
    #live-info {
        position: absolute; top: 10px; right: 12px;
        max-width: 330px;
        background: rgba(18,20,26,.78); border: 1px solid var(--line);
        border-radius: 6px; padding: 8px 11px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px; line-height: 1.75; color: var(--fg-dim);
        pointer-events: none; white-space: pre-wrap;
    }
    #live-info:empty { display: none; }
    #live-info b { color: var(--fg); font-weight: 600; }
    #live-info .ok { color: #7ee787; }
    #live-info .warn { color: #ffa657; }
    .k-total { color: #fb923c; } .k-kin { color: #22d3ee; } .k-pot { color: #a78bfa; }

    .lil-gui { --width: 268px; z-index: 20; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.156.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.156.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
    <aside id="sidebar">
        <header>
            <h1>XPBD <span>刚体模拟</span></h1>
            <div class="sub">
                Müller 等《Detailed Rigid Body Simulation with
                Extended Position Based Dynamics》(SCA 2020) 的 JavaScript 复现
            </div>
        </header>
        <nav id="scene-list"></nav>
        <div id="scene-info"></div>
        <footer>
            左键拖拽物体 · 右键/滚轮 转视角<br>
            <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重置场景
        </footer>
    </aside>

    <div id="view">
        <div id="hud">
            <span id="fps">— FPS</span>
            <div id="stats"></div>
        </div>
        <div id="live-info"></div>
        <div id="energy-panel">
            <div class="cap">能量监视（论文图 9）</div>
            <canvas id="energy"></canvas>
            <div class="legend">
                <span class="k-total">■ 总能量</span>
                <span class="k-kin">■ 动能</span>
                <span class="k-pot">■ 势能</span>
            </div>
        </div>
    </div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
