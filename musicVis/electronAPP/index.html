<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>音频可视化 (Electron)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html,body{margin:0;height:100%;background:#0a0b10;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,Arial;color:#cfd4ff}
  #ui{position:fixed;top:64px;left:16px;z-index:10;display:grid;gap:8px;width:300px;
      background:rgba(10,12,22,.65);backdrop-filter:blur(8px);border:1px solid rgba(120,130,255,.2);
      border-radius:12px;padding:12px 14px;box-shadow:0 10px 32px rgba(0,0,0,.35)}
  #ui .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
  #ui button,#ui select,#ui input[type="range"],#ui input[type="checkbox"]{appearance:none;border:1px solid rgba(120,130,255,.3);
      background:rgba(30,35,70,.6);color:#e8ebff;border-radius:10px;padding:8px 10px;cursor:pointer}
  #toggle{position:fixed;top:16px;left:16px;z-index:11;padding:8px 10px;border-radius:10px;border:1px solid rgba(120,130,255,.35);
      background:rgba(10,12,22,.8);color:#e8ebff}
  #msg{position:fixed;bottom:12px;left:12px;right:12px;font-size:12px;color:#aeb5ff}
</style>

<!-- three.js Import Map（用 CDN 最省事） -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<button id="toggle">👁 隐藏菜单</button>

<div id="ui">
  <div class="row">
    <button id="btnSystemWin">🎧 系统音频（Windows 一键）</button>
    <button id="btnMic">🎙 麦克风</button>
  </div>
  <div class="row">
    <div>输入设备</div>
    <select id="inputList"><option>（点击刷新设备）</option></select>
  </div>
  <div class="row"><div>灵敏度</div><input id="sens" type="range" min="0.5" max="6" step="0.1" value="2.2"></div>
  <div class="row"><div>平滑度</div><input id="smooth" type="range" min="0" max="0.95" step="0.01" value="0.85"></div>
  <div class="row"><div>FFT</div><input id="fft" type="range" min="256" max="4096" step="256" value="1024"></div>
  <div class="row"><div>Bloom</div><input id="bloom" type="range" min="0" max="3" step="0.05" value="1.4"></div>
  <div class="row"><div>曝光</div><input id="expo" type="range" min="0.6" max="2.2" step="0.05" value="1.6"></div>
  <div class="row"><div>粒子</div><input id="count" type="range" min="500" max="8000" step="100" value="2200"></div>
  <div class="row"><div>永远刷新</div><label><input id="always" type="checkbox"> 后台也渲染</label></div>
  <div class="row">
    <div>刷新率</div>
    <select id="fps"><option>30</option><option selected>60</option><option>90</option><option>120</option></select>
  </div>
  <button id="btnStop" style="display:none;">🛑 停止</button>
</div>

<div id="msg">Windows：点“系统音频（Windows 一键）”；macOS：安装 BlackHole/Loopback 后，在“输入设备”里选择该设备。</div>
<canvas id="c"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const btnSystemWin = document.getElementById('btnSystemWin');
const btnMic = document.getElementById('btnMic');
const inputList = document.getElementById('inputList');
const sens = document.getElementById('sens');
const smooth = document.getElementById('smooth');
const fft = document.getElementById('fft');
const bloom = document.getElementById('bloom');
const expo = document.getElementById('expo');
const count = document.getElementById('count');
const always = document.getElementById('always');
const fps = document.getElementById('fps');
const btnStop = document.getElementById('btnStop');
const msgEl = document.getElementById('msg');
const toggle = document.getElementById('toggle');
const panel = document.getElementById('ui');

toggle.onclick = () => {
  const hide = panel.style.display !== 'none';
  panel.style.display = hide ? 'none' : 'grid';
  toggle.textContent = hide ? '📂 显示菜单' : '👁 隐藏菜单';
};

// macOS 不支持“一键系统音频”，提示用虚拟声卡
const isMac = /Mac/i.test(navigator.platform) || /Mac OS/.test(navigator.userAgent);
if (isMac) {
  btnSystemWin.disabled = true;
  btnSystemWin.title = 'macOS 需安装 BlackHole/Loopback，并在“输入设备”里选择';
  btnSystemWin.textContent = '🎧 系统音频（macOS 不适用）';
}

// 如果 preload 注入失败，避免 undefined
if (!window.electronAPI || typeof window.electronAPI.listSources !== 'function') {
  // 只有 Windows 会用到这个按钮
  if (!isMac) {
    btnSystemWin.disabled = true;
    btnSystemWin.textContent = '🎧 系统音频（未就绪: preload 失败）';
  }
  console.warn('electronAPI 未注入：请检查 main.js 的 preload 指向 preload.cjs。');
}

// ===== three.js 场景（亮一点）=====
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +expo.value;
expo.oninput = () => renderer.toneMappingExposure = +expo.value;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070813, 0.025);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 10, 34);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = .4;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.add(new THREE.HemisphereLight(0x6a8cff, 0x0a0b14, 1.1));
const dir = new THREE.DirectionalLight(0xffffff, 2.4); dir.position.set(12,18,6); scene.add(dir);
const camLight = new THREE.PointLight(0x88aaff, 1.3, 60, 2.0); camera.add(camLight); scene.add(camera);

const ground = new THREE.Mesh(new THREE.CircleGeometry(80,128),
  new THREE.MeshPhysicalMaterial({ color:0x0d1024, metalness:.1, roughness:.95, clearcoat:.2 }));
ground.rotation.x = -Math.PI/2; scene.add(ground);

// 粒子
let points=null;
function buildParticles(n){
  if(points){scene.remove(points); points.geometry.dispose(); points.material.dispose(); points=null;}
  const geo = new THREE.BufferGeometry(); const pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=30*Math.cbrt(Math.random()), t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.cos(p)*0.6; pos[i*3+2]=r*Math.sin(p)*Math.sin(t);}
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  points = new THREE.Points(geo, new THREE.PointsMaterial({ size:.085, transparent:true, opacity:.8,
    depthWrite:false, blending:THREE.AdditiveBlending, color:0xffffff }));
  scene.add(points);
}
buildParticles(+count.value);
count.onchange = () => buildParticles(+count.value);

// 频谱环
let bars, barCount=220; const radius=14;
function buildBars(cnt){
  if(bars){scene.remove(bars); bars.geometry.dispose(); bars.material.dispose(); bars=null;}
  barCount = cnt;
  const geom = new THREE.BoxGeometry(.5,1,.5);
  const mat = new THREE.MeshPhysicalMaterial({
    color:0x3355ff, metalness:.9, roughness:.2, clearcoat:.6, clearcoatRoughness:.35,
    emissive:0x3344ff, emissiveIntensity:1.0, envMapIntensity:1.3, vertexColors:true
  });
  bars = new THREE.InstancedMesh(geom, mat, barCount);
  const tmp = new THREE.Object3D(), c = new THREE.Color();
  for(let i=0;i<barCount;i++){
    const t=i/barCount, ang=t*Math.PI*2;
    tmp.position.set(Math.cos(ang)*radius,.5,Math.sin(ang)*radius); tmp.lookAt(0,.5,0); tmp.updateMatrix();
    bars.setMatrixAt(i,tmp.matrix); c.setHSL(.65+.35*t,.9,.55); bars.setColorAt(i,c);
  }
  bars.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(bars);
}
buildBars(220);

// 核心体
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(2.6,3),
  new THREE.MeshPhysicalMaterial({ color:0x7aa2ff, metalness:.95, roughness:.15, clearcoat:1.0, clearcoatRoughness:.1,
                                   emissive:0x2040ff, emissiveIntensity:1.0, envMapIntensity:1.3 }));
scene.add(core);

// 后处理
let composer, bloomPass;
const after = new AfterimagePass(); after.uniforms.damp.value = .87;
function buildComposer(){
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  composer.addPass(after);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), +bloom.value, .4, .85);
  composer.addPass(bloomPass);
}
buildComposer();
bloom.oninput = () => bloomPass.strength = +bloom.value;

// 音频（Electron 本地）
let audioCtx=null, analyser=null, dataArray=null, srcNode=null, mediaStream=null, started=false;

async function startWithStream(stream){
  stopCapture(false); mediaStream=stream;
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') await audioCtx.resume();
  srcNode = audioCtx.createMediaStreamSource(stream);
  setupAnalyser(+fft.value, +smooth.value);
  srcNode.connect(analyser);
  started=true; btnStop.style.display=''; setMsg('音频捕捉中…');
  stream.getTracks().forEach(t=>t.addEventListener('ended', ()=>stopCapture()));
}
function setupAnalyser(fftSize=1024, smoothing=.85){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = fftSize; analyser.smoothingTimeConstant = smoothing;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

async function captureSystemAudioWindows() {
  try {
    if (!window.electronAPI || typeof window.electronAPI.listSources !== 'function') {
      throw new Error('preload 未注入或被禁用');
    }
    const sources = await window.electronAPI.listSources();
    const pick = sources.find(s => /screen\s*1|display\s*1|显示器\s*1/i.test(s.name)) || sources[0];
    if (!pick) throw new Error('未找到可用屏幕源');

    // ★ Windows: WASAPI loopback。需要带一点 video 才能匹配 desktop 源
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        mandatory: {
          chromeMediaSource: 'desktop',
          chromeMediaSourceId: pick.id
        }
      },
      video: {
        mandatory: {
          chromeMediaSource: 'desktop',
          chromeMediaSourceId: pick.id,
          maxFrameRate: 1, minWidth: 16, minHeight: 16
        }
      }
    });
    await startWithStream(stream);
  } catch (e) {
    setMsg('系统音频抓取失败：' + e.message + (isMac ? '（macOS 不支持，需虚拟声卡）' : ''));
  }
}

async function captureMic(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    await startWithStream(stream);
  }catch(e){ setMsg('麦克风失败：'+e.message); }
}

async function captureFromSelectedInput(){
  try{
    const id = inputList.value;
    const stream = await navigator.mediaDevices.getUserMedia({ audio:{ deviceId: id ? { exact:id } : undefined } });
    await startWithStream(stream);
  }catch(e){ setMsg('输入设备失败：'+e.message); }
}

function stopCapture(show=true){
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  if(srcNode && srcNode.disconnect) try{ srcNode.disconnect(); }catch{}
  srcNode=null; analyser=null; dataArray=null; started=false; btnStop.style.display='none';
  if(show) setMsg('已停止');
}

// 设备列表（macOS 选虚拟声卡；Windows 可选立体声混音/环回虚拟设备）
async function refreshInputs(){
  try{
    const prev = inputList.value;
    const devices = await navigator.mediaDevices.enumerateDevices();
    const inputs = devices.filter(d=>d.kind==='audioinput');
    inputList.innerHTML = inputs.map(d=>`<option value="${d.deviceId}">${d.label||'未命名输入'}</option>`).join('');
    if(inputs.length) inputList.value = prev || inputs[0].deviceId;
  }catch(e){
    // 第一次可能需要用户先触发 getUserMedia 才能拿到 label
  }
}
navigator.mediaDevices.ondevicechange = refreshInputs;
refreshInputs();

// 事件
btnSystemWin.onclick = () => { if (!isMac) captureSystemAudioWindows(); };
btnMic.onclick = captureMic;
inputList.onchange = captureFromSelectedInput;
btnStop.onclick = () => stopCapture(true);
fft.oninput = () => { if(started){ setupAnalyser(+fft.value, analyser ? analyser.smoothingTimeConstant : +smooth.value); if(srcNode) srcNode.connect(analyser); } };
smooth.oninput = () => { if(analyser) analyser.smoothingTimeConstant = +smooth.value; };

// 渲染循环 + FPS 控制（手动）
const dummy = new THREE.Object3D(), tempColor = new THREE.Color();
let rafId=null, intervalId=null, frameMs=1000/60, last=0;

function renderStep(){
  const time = performance.now()*.001;
  if(analyser && dataArray){
    analyser.getByteFrequencyData(dataArray);
    const sensitivity=+sens.value, n=barCount, binCount=dataArray.length;
    const avg=avgVal(dataArray), bass=bandAvg(dataArray,0,64);
    for(let i=0;i<n;i++){
      const t=i/(n-1), idx=Math.min(binCount-1, Math.floor(Math.pow(t,1.5)*binCount));
      const v=dataArray[idx]/255, amp=Math.min(1, v*sensitivity), h=.25+2.9*amp;
      const ang=(i/n)*Math.PI*2, x=Math.cos(ang)*radius, z=Math.sin(ang)*radius;
      dummy.position.set(x,h*.5,z); dummy.lookAt(0,h*.5,0);
      dummy.scale.set(1,Math.max(.2,h),1); dummy.updateMatrix(); bars.setMatrixAt(i,dummy.matrix);
      const hueFlow=.08*Math.sin(time*.7 + t*Math.PI*2);
      const hue=(0.66 - 0.66*amp + hueFlow + 1)%1, light=.45+.25*amp;
      tempColor.setHSL(hue,.95,light); bars.setColorAt(i,tempColor);
    }
    bars.instanceMatrix.needsUpdate = true; if (bars.instanceColor) bars.instanceColor.needsUpdate = true;
    core.scale.setScalar(1 + bass*.02*sensitivity);
    core.rotation.x += .002 + avg*.002; core.rotation.y += .003 + avg*.002;
    core.material.emissiveIntensity = 1.0 + Math.min(1.2, bass*2.0*sensitivity);
    if(points){ const pm=points.material;
      pm.size = .06 + avg*.22*sensitivity;
      pm.color.setHSL((.55+.1*Math.sin(time*.5))%1, .6, .75+.1*avg);
      points.rotation.y += .0008 + avg*.001; }
    bars.material.emissiveIntensity = 1.0 + avg*1.6*sensitivity;
  }
  controls.update(); composer.render();
}

function startRAF(){
  stopTimers(); frameMs = 1000/(+fps.value||60); last = performance.now();
  const loop = (now)=>{ rafId=requestAnimationFrame(loop); if(now-last >= frameMs-1){ renderStep(); last=now; } };
  rafId = requestAnimationFrame(loop);
}
function startInterval(){ stopTimers(); frameMs = 1000/(+fps.value||60); intervalId = setInterval(renderStep, Math.max(1,Math.floor(frameMs))); }
function stopTimers(){ if(rafId) cancelAnimationFrame(rafId), rafId=null; if(intervalId) clearInterval(intervalId), intervalId=null; }
function applyLoop(){ always.checked ? startInterval() : startRAF(); }
always.onchange = applyLoop; fps.onchange = applyLoop;
applyLoop();

// 工具 & 自适应
function avgVal(a){let s=0; for(let i=0;i<a.length;i++) s+=a[i]; return s/(255*a.length)}
function bandAvg(a,s,e){s=Math.max(0,s); e=Math.min(a.length,e); let sum=0,n=0; for(let i=s;i<e;i++){sum+=a[i];n++;} return n?sum/(255*n):0}
window.addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight); bloomPass.setSize(innerWidth,innerHeight);
});
function setMsg(t){ msgEl.textContent = t; }

// 后处理在最后创建，确保尺寸正确
// const after = new AfterimagePass(); after.uniforms.damp.value = .87;
(function buildComposer(){
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  composer.addPass(after);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), +bloom.value, .4, .85);
  composer.addPass(bloomPass);
})();
</script>
</body>
</html>
