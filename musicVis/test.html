<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Three.js 音乐可视化 – 手动刷新模式 & FPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin:0; height:100%; background:#0a0b10; overflow:hidden; font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; color:#cfd4ff; }
    #ui {
      position: fixed; top: 64px; left: 16px; z-index: 10; display: grid; gap: 8px;
      background: rgba(10,12,22,0.65); backdrop-filter: blur(8px);
      border: 1px solid rgba(120,130,255,0.2); border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.35);
      transition: transform .25s ease, opacity .25s ease;
      width: 280px;
    }
    #ui.hidden { transform: translateX(-140%); opacity: 0; pointer-events: none; }
    #ui button, #ui input[type="range"], #ui select, #ui input[type="checkbox"] {
      appearance: none; border: 1px solid rgba(120,130,255,0.3); color:#e8ebff; background: rgba(30,35,70,0.6);
      padding: 8px 10px; border-radius: 10px; cursor: pointer; outline: none;
    }
    #ui button:hover, #togglePanel:hover { background: rgba(60,70,140,0.6); }
    #ui .row { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px; }
    #ui .label { color:#9aa3ff; font-size:12px; }
    #msg { position: fixed; bottom:12px; left:12px; right:12px; text-align:left; color:#aeb5ff; opacity:.9; font-size:12px; }
    #credits { position: fixed; right:14px; bottom:14px; font-size:12px; color:#7f87cc; opacity:.8; }
    #togglePanel {
      position: fixed; top:16px; left:16px; z-index: 11;
      background: rgba(10,12,22,0.8); color:#e8ebff; border:1px solid rgba(120,130,255,0.35);
      padding: 8px 10px; border-radius: 10px; cursor: pointer;
    }
  </style>

  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="togglePanel">👁 隐藏菜单</button>

  <div id="ui">
    <button id="btnSystem">🎧 捕捉系统音频</button>
    <button id="btnMic">🎙 使用麦克风</button>

    <div class="row">
      <div class="label">灵敏度</div>
      <input id="sensitivity" type="range" min="0.5" max="6" value="2.2" step="0.1" />
    </div>
    <div class="row">
      <div class="label">平滑度</div>
      <input id="smoothing" type="range" min="0" max="0.95" value="0.85" step="0.01" />
    </div>
    <div class="row">
      <div class="label">分辨率</div>
      <input id="fft" type="range" min="256" max="4096" value="1024" step="256" />
    </div>
    <div class="row">
      <div class="label">Bloom 强度</div>
      <input id="bloom" type="range" min="0" max="3" value="1.4" step="0.05" />
    </div>
    <div class="row">
      <div class="label">曝光</div>
      <input id="exposure" type="range" min="0.6" max="2.2" value="1.6" step="0.05" />
    </div>
    <div class="row">
      <div class="label">粒子数量</div>
      <input id="particles" type="range" min="500" max="8000" value="2200" step="100" />
    </div>

    <!-- ⭐ 新增：刷新模式 & 刷新率 -->
    <div class="row">
      <div class="label">永远刷新</div>
      <label style="display:flex;align-items:center;gap:8px;">
        <input id="always" type="checkbox" />
        <span style="font-size:12px;color:#bfc6ff;">后台也持续渲染</span>
      </label>
    </div>
    <div class="row">
      <div class="label">刷新率</div>
      <select id="fps">
        <option value="30">30 FPS</option>
        <option value="60" selected>60 FPS</option>
        <option value="90">90 FPS</option>
        <option value="120">120 FPS</option>
      </select>
    </div>

    <button id="btnStop" style="display:none;">🛑 停止捕捉</button>
  </div>

  <div id="msg">提示：用 Chrome/Edge 选择<strong>正在播放声音的标签页</strong>并勾选「共享此标签页音频」，或选择「整个屏幕」并勾选「共享系统音频」。需要 HTTPS。</div>
  <div id="credits">three.js 可视化 ✨</div>

  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ---------- DOM ----------
    const canvas = document.getElementById('c');
    const btnSystem = document.getElementById('btnSystem');
    const btnMic = document.getElementById('btnMic');
    const btnStop = document.getElementById('btnStop');
    const sensitivityEl = document.getElementById('sensitivity');
    const smoothingEl = document.getElementById('smoothing');
    const fftEl = document.getElementById('fft');
    const bloomEl = document.getElementById('bloom');
    const particlesEl = document.getElementById('particles');
    const exposureEl = document.getElementById('exposure');
    const msgEl = document.getElementById('msg');
    const panelEl = document.getElementById('ui');
    const toggleBtn = document.getElementById('togglePanel');
    const alwaysEl = document.getElementById('always');
    const fpsEl = document.getElementById('fps');

    // 面板显隐（记忆）
    const savedHidden = localStorage.getItem('panelHidden') === '1';
    if (savedHidden) { panelEl.classList.add('hidden'); toggleBtn.textContent = '📂 显示菜单'; }
    toggleBtn.addEventListener('click', () => {
      panelEl.classList.toggle('hidden');
      const hidden = panelEl.classList.contains('hidden');
      toggleBtn.textContent = hidden ? '📂 显示菜单' : '👁 隐藏菜单';
      localStorage.setItem('panelHidden', hidden ? '1' : '0');
    });

    // ---------- THREE ----------
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = +exposureEl.value;
    exposureEl.addEventListener('input', () => renderer.toneMappingExposure = +exposureEl.value);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070813, 0.03);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 34);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    // 环境贴图 + 灯光
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.add(new THREE.HemisphereLight(0x6a8cff, 0x0a0b14, 1.0));
    const dir = new THREE.DirectionalLight(0xffffff, 2.2); dir.position.set(12, 18, 6); scene.add(dir);
    const camLight = new THREE.PointLight(0x88aaff, 1.3, 60, 2.0); camera.add(camLight); scene.add(camera);

    // 地面
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(80, 128),
      new THREE.MeshPhysicalMaterial({ color: 0x0d1024, metalness: 0.1, roughness: 0.95, clearcoat: 0.2 })
    );
    ground.rotateX(-Math.PI/2); scene.add(ground);

    // 粒子
    let points = null;
    function buildParticles(count) {
      if (points) { scene.remove(points); points.geometry.dispose(); points.material.dispose(); points = null; }
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i=0;i<count;i++){
        const r = 30*Math.cbrt(Math.random()), th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
        pos[i*3] = r*Math.sin(ph)*Math.cos(th);
        pos[i*3+1] = r*Math.cos(ph)*0.6;
        pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
      const mat = new THREE.PointsMaterial({ size:0.085, transparent:true, opacity:0.8, depthWrite:false, blending:THREE.AdditiveBlending, color:0xffffff });
      points = new THREE.Points(geo, mat); scene.add(points);
    }
    buildParticles(+particlesEl.value);

    // 频谱环
    let bars, barCount = 220; const radius = 14;
    function buildBars(count) {
      if (bars) { scene.remove(bars); bars.geometry.dispose(); bars.material.dispose(); bars = null; }
      barCount = count;
      const geom = new THREE.BoxGeometry(0.5,1,0.5);
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0x3355ff, metalness: 0.9, roughness: 0.2, clearcoat: 0.6, clearcoatRoughness: 0.35,
        emissive: 0x3344ff, emissiveIntensity: 1.0, envMapIntensity: 1.3, vertexColors: true
      });
      bars = new THREE.InstancedMesh(geom, mat, barCount);
      const dummy = new THREE.Object3D(), col = new THREE.Color();
      for (let i=0;i<barCount;i++){
        const t=i/barCount, ang=t*Math.PI*2;
        dummy.position.set(Math.cos(ang)*radius,0.5,Math.sin(ang)*radius);
        dummy.lookAt(0,0.5,0); dummy.updateMatrix(); bars.setMatrixAt(i,dummy.matrix);
        col.setHSL(0.65+0.35*t,0.9,0.55); bars.setColorAt(i,col);
      }
      bars.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(bars);
    }
    buildBars(220);

    // 中心体
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2.6,3),
      new THREE.MeshPhysicalMaterial({ color:0x7aa2ff, metalness:0.95, roughness:0.15, clearcoat:1.0, clearcoatRoughness:0.1,
        emissive:0x2040ff, emissiveIntensity:1.0, envMapIntensity:1.3 })
    );
    scene.add(core);

    // 后处理
    let composer, bloomPass, afterimagePass;
    function buildComposer(){
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene,camera));
      afterimagePass = new AfterimagePass(); afterimagePass.uniforms['damp'].value = 0.87; composer.addPass(afterimagePass);
      bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), +bloomEl.value, 0.4, 0.85);
      composer.addPass(bloomPass);
    }
    buildComposer();

    // ---------- 音频 ----------
    let audioCtx=null, analyser=null, dataArray=null, srcNode=null, mediaStream=null, started=false;
    function setupAnalyser(fftSize=1024, smoothing=0.85){
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = fftSize; analyser.smoothingTimeConstant = smoothing;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    async function startWithStream(stream){
      stopCapture(false); mediaStream = stream;
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const source = audioCtx.createMediaStreamSource(stream); srcNode = source;
      setupAnalyser(+fftEl.value, +smoothingEl.value); source.connect(analyser);
      started=true; btnStop.style.display=''; msg('音频捕捉中…');
      stream.getTracks().forEach(t=>t.addEventListener('ended',()=>stopCapture()));
    }
    async function captureSystemAudio(){
      try{
        const stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:{ echoCancellation:false, noiseSuppression:false, sampleRate:48000 }});
        await startWithStream(stream);
      }catch(e){ error('无法捕捉系统音频：'+e.message); }
    }
    async function captureMic(){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true }, video:false });
        await startWithStream(stream);
      }catch(e){ error('无法访问麦克风：'+e.message); }
    }
    function stopCapture(showMsg=true){
      if (mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
      if (srcNode && srcNode.disconnect) try{ srcNode.disconnect(); }catch{}
      srcNode=null; analyser=null; dataArray=null; started=false; btnStop.style.display='none';
      if (showMsg) msg('已停止捕捉。');
    }

    // ---------- 事件 ----------
    btnSystem.addEventListener('click', captureSystemAudio);
    btnMic.addEventListener('click', captureMic);
    btnStop.addEventListener('click', ()=>stopCapture(true));
    sensitivityEl.addEventListener('input', ()=>msg('灵敏度：'+sensitivityEl.value));
    smoothingEl.addEventListener('input', ()=>{ if (analyser) analyser.smoothingTimeConstant = +smoothingEl.value; });
    fftEl.addEventListener('input', ()=>{
      if (started){ setupAnalyser(+fftEl.value, analyser ? analyser.smoothingTimeConstant : +smoothingEl.value); if (srcNode) srcNode.connect(analyser); }
    });
    bloomEl.addEventListener('input', ()=>{ if (bloomPass) bloomPass.strength = +bloomEl.value; });
    particlesEl.addEventListener('change', ()=>buildParticles(+particlesEl.value));

    // ---------- 渲染核心 ----------
    const dummy = new THREE.Object3D(), tempColor = new THREE.Color();

    function renderStep(){
      const time = performance.now()*0.001;

      if (analyser && dataArray){
        analyser.getByteFrequencyData(dataArray);

        const sensitivity=+sensitivityEl.value, n=barCount, binCount=dataArray.length;
        const avg=average(dataArray), bass=bandAvg(dataArray,0,64);

        for (let i=0;i<n;i++){
          const t=i/(n-1), idx=Math.min(binCount-1, Math.floor(Math.pow(t,1.5)*binCount));
          const v=dataArray[idx]/255, amp=Math.min(1, v*sensitivity), h=0.25+2.9*amp;
          const ang=(i/n)*Math.PI*2, x=Math.cos(ang)*radius, z=Math.sin(ang)*radius;
          dummy.position.set(x,h*0.5,z); dummy.lookAt(0,h*0.5,0);
          dummy.scale.set(1,Math.max(0.2,h),1); dummy.updateMatrix(); bars.setMatrixAt(i,dummy.matrix);

          const hueFlow=0.08*Math.sin(time*0.7 + t*Math.PI*2);
          const hue=(0.66 - 0.66*amp + hueFlow + 1.0)%1.0, light=0.45+0.25*amp;
          tempColor.setHSL(hue,0.95,light); bars.setColorAt(i,tempColor);
        }
        bars.instanceMatrix.needsUpdate = true; if (bars.instanceColor) bars.instanceColor.needsUpdate = true;

        core.scale.setScalar(1 + bass*0.02*sensitivity);
        core.rotation.x += 0.002 + avg*0.002; core.rotation.y += 0.003 + avg*0.002;
        core.material.emissiveIntensity = 1.0 + Math.min(1.2, bass*2.0*sensitivity);

        if (points){
          const pm=points.material;
          pm.size = 0.06 + avg*0.22*sensitivity;
          pm.color.setHSL((0.55 + 0.1*Math.sin(time*0.5))%1, 0.6, 0.75+0.1*avg);
          points.rotation.y += 0.0008 + avg*0.001;
        }
        bars.material.emissiveIntensity = 1.0 + avg*1.6*sensitivity;
      }

      controls.update();
      composer ? composer.render() : renderer.render(scene, camera);
    }

    // ---------- FPS/模式控制（手动） ----------
    let rafId=null, intervalId=null, frameMs=1000/60, last=0;

    function startRAF(){
      stopTimers();
      frameMs = 1000 / (+fpsEl.value || 60);
      last = performance.now();
      const loop = (now) => {
        rafId = requestAnimationFrame(loop);
        if (now - last >= frameMs - 1) { renderStep(); last = now; }
      };
      rafId = requestAnimationFrame(loop);
    }
    function startInterval(){
      stopTimers();
      frameMs = 1000 / (+fpsEl.value || 60);
      intervalId = setInterval(renderStep, Math.max(1, Math.floor(frameMs)));
    }
    function stopTimers(){ if (rafId){ cancelAnimationFrame(rafId); rafId=null; } if (intervalId){ clearInterval(intervalId); intervalId=null; } }

    function applyLoopMode(){
      if (alwaysEl.checked) startInterval(); else startRAF();
    }
    alwaysEl.addEventListener('change', applyLoopMode);
    fpsEl.addEventListener('change', applyLoopMode);

    // 初始启动
    applyLoopMode();

    // ---------- Utils ----------
    function average(arr){ let s=0; for (let i=0;i<arr.length;i++) s += arr[i]; return s/(255*arr.length); }
    function bandAvg(arr,start,end){ start=Math.max(0,start); end=Math.min(arr.length,end); let s=0,n=0; for(let i=start;i<end;i++){s+=arr[i];n++;} return n?(s/(255*n)):0; }

    // ---------- 自适应 ----------
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      if (composer) { composer.setSize(innerWidth, innerHeight); if (bloomPass) bloomPass.setSize(innerWidth, innerHeight); }
    });

    function msg(t){ msgEl.textContent = t; }
    function error(t){ console.error(t); msgEl.innerHTML = '⚠️ ' + t + '<br>提示：在 Chrome/Edge 下点击「捕捉系统音频」，并勾选共享音频。'; }
  </script>
</body>
</html>
